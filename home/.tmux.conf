# ===== Basics =====
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g history-limit 100000
set -g mouse on
set -g focus-events on

# Faster key response
set -sg escape-time 10

# ===== Prefix =====
# Keep default C-b (safe). If you prefer C-a:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ===== Splits (more ergonomic) =====
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# ===== Navigation (vim-like) =====
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# ===== Copy mode (vim keys) =====
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# macOS clipboard integration (works if pbcopy exists)
if-shell 'command -v pbcopy >/dev/null 2>&1' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'

# ===== Status bar =====
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

set -g status-left  "#S "
set -g status-right "%Y-%m-%d %H:%M "

# ===== Quality-of-life =====
# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# New panes start in current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
